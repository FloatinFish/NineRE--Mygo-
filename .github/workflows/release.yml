name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache-dependency-path: launcher/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build launcher
        working-directory: launcher
        shell: pwsh
        env:
          GOFLAGS: -buildvcs=false
        run: |
          bun install --frozen-lockfile
          bun run build -- -skip-installer

      - name: Package release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem -Path launcher/build/windows-amd64 -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "launcher exe not found" }
          Copy-Item $exe.FullName dist/NineRE-Launcher.exe -Force
          Copy-Item $exe.FullName dist/NineRE-Starter.exe -Force
          Copy-Item $exe.FullName dist/NineRegionsLauncher.exe -Force
          $h1 = (Get-FileHash dist/NineRE-Launcher.exe -Algorithm SHA256).Hash.ToLower()
          $h2 = (Get-FileHash dist/NineRE-Starter.exe -Algorithm SHA256).Hash.ToLower()
          $h3 = (Get-FileHash dist/NineRegionsLauncher.exe -Algorithm SHA256).Hash.ToLower()
          @("$h1  NineRE-Launcher.exe", "$h2  NineRE-Starter.exe", "$h3  NineRegionsLauncher.exe") |
            Out-File -FilePath dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NineRE-Launcher.exe
            dist/NineRE-Starter.exe
            dist/NineRegionsLauncher.exe
            dist/SHA256SUMS
          generate_release_notes: true
